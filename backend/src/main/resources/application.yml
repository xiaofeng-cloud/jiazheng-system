server:
  port: 8080

spring:
  application:
    name: jiazheng-system-backend
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

security:
  jwt:
    # 生产部署必须通过环境配置替换此开发密钥。
    secret: local-development-secret-key-please-change
    expiration-seconds: 86400

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
